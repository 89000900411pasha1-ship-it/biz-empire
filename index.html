<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NFT Tap Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(180deg, #0a0015, #1a0030); color: #fff; min-height: 100vh; user-select: none; }
        .header { background: linear-gradient(135deg, #2a0050, #5a00a0); padding: 15px; text-align: center; }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .balance-row { display: flex; justify-content: center; align-items: center; gap: 15px; font-size: 14px; margin-top: 5px; flex-wrap: wrap; }
        .balance-row span { color: #ffd700; font-weight: bold; }
        .tap-area { display: flex; flex-direction: column; align-items: center; padding: 30px; }
        .tap-button { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, #ffd700, #ff8c00); border: 4px solid #fff; cursor: pointer; font-size: 50px; box-shadow: 0 0 40px rgba(255,215,0,0.5); transition: transform 0.1s; }
        .tap-button:active { transform: scale(0.9); }
        .tap-info { margin-top: 15px; font-size: 14px; color: #aaa; }
        .tabs { display: flex; background: #1a0030; position: sticky; top: 0; z-index: 99; overflow-x: auto; }
        .tab { flex: 1; min-width: 50px; padding: 10px; text-align: center; cursor: pointer; font-size: 11px; border-bottom: 3px solid transparent; white-space: nowrap; }
        .tab.active { border-bottom-color: #ffd700; color: #ffd700; }
        .content { padding: 15px; padding-bottom: 80px; }
        .card { background: linear-gradient(135deg, #1a0040, #2a0050); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #3a0060; display: flex; align-items: center; gap: 10px; }
        .emoji-big { font-size: 40px; min-width: 50px; text-align: center; }
        .info { flex: 1; }
        .name { font-weight: bold; font-size: 14px; }
        .detail { font-size: 11px; color: #aaa; }
        .gold { color: #ffd700; }
        .btn { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
        .btn-purple { background: linear-gradient(135deg, #9c27b0, #6a1b9a); color: #fff; }
        .btn-blue { background: linear-gradient(135deg, #2196f3, #1565c0); color: #fff; }
        .float { position: fixed; font-size: 24px; font-weight: bold; pointer-events: none; animation: up 1.2s ease-out forwards; z-index: 200; }
        @keyframes up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-150px); } }
        .rarity-common { color: #aaa; } .rarity-uncommon { color: #4caf50; } .rarity-rare { color: #2196f3; } .rarity-epic { color: #9c27b0; } .rarity-legendary { color: #ffd700; } .rarity-mythic { color: #ff4081; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👆 NFT Tap Game</h1>
        <div class="balance-row">
            💎 <span id="tonBalance">0</span> TON | 🪙 <span id="coinBalance">0</span> | ⭐ <span id="level">1</span> ур
            <button class="btn btn-sm btn-purple" onclick="connectWallet()" id="walletBtn">🔗 Кошелёк</button>
        </div>
    </div>
    <div class="tap-area">
        <button class="tap-button" id="tapBtn" onclick="tap()">👆</button>
        <div class="tap-info">Множитель: x<span id="multiplier">1.0</span> | Тапов: <span id="totalTaps">0</span></div>
    </div>
    <div class="tabs">
        <div class="tab active" data-tab="boxes">📦 Боксы</div>
        <div class="tab" data-tab="inventory">🎒 Скины</div>
        <div class="tab" data-tab="market">💱 Маркет</div>
        <div class="tab" data-tab="tournament">🏆 Турнир</div>
        <div class="tab" data-tab="referral">👥 Друзья</div>
        <div class="tab" data-tab="top">📊 Топ</div>
    </div>
    <div class="content" id="content"></div>
    <script>
        const API = 'https://pashsasd.pythonanywhere.com';
        let uid = 123;
        let userData = {}, inventory = [], tab = 'boxes';
        async function api(url) { const sep = url.includes('?')?'&':'?'; const r = await fetch(API+url+sep+'user_id='+uid); return await r.json(); }
        async function load() {
            const u = await api('/api/user'); userData = u.user;
            document.getElementById('tonBalance').textContent = (userData.balance_ton||0).toFixed(1);
            document.getElementById('coinBalance').textContent = Math.floor(userData.balance_coins||0).toLocaleString();
            document.getElementById('level').textContent = userData.level||1;
            document.getElementById('totalTaps').textContent = (userData.total_taps||0).toLocaleString();
            if(userData.wallet_address) document.getElementById('walletBtn').textContent = '✅ '+userData.wallet_address.substring(0,8)+'...';
            const inv = await api('/api/inventory'); inventory = inv;
            const maxMul = Math.max(1.0,...inv.filter(i=>!i.listed&&!i.staked).map(i=>i.multiplier));
            document.getElementById('multiplier').textContent = maxMul.toFixed(1);
            showTab(tab);
        }
        function showTab(t) {
            tab = t;
            document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
            document.querySelector('[data-tab="'+t+'"]')?.classList.add('active');
            const c = document.getElementById('content');
            if(t==='boxes'){ api('/api/boxes').then(boxes=>{ c.innerHTML='<h3>📦 Боксы</h3>'+boxes.map(b=>`<div class="card" onclick="openBox(${b.id})"><div class="emoji-big">${b.emoji}</div><div class="info"><div class="name">${b.name}</div><div class="detail">${b.desc}</div><div class="gold">💎 ${b.price_ton} TON</div></div><button class="btn btn-sm">Открыть</button></div>`).join(''); }); }
            else if(t==='inventory'){ c.innerHTML='<h3>🎒 Мои скины</h3>'+(inventory.length===0?'<p style="color:#aaa">Нет скинов</p>':inventory.map(s=>`<div class="card"><div class="emoji-big">${s.emoji}</div><div class="info"><div class="name">${s.name} <span class="rarity-${s.rarity}">[${s.rarity}]</span></div><div class="detail">Множитель: x${s.multiplier} | Уровень: ${s.upgrade||0} ${s.staked?'🔒 Стейк':''}</div>${s.listed?`<div class="gold">В продаже за ${s.price} TON</div>`:`<button class="btn btn-sm btn-purple" onclick="sellSkin(${s.id})">Продать</button> <button class="btn btn-sm btn-blue" onclick="upgradeSkin(${s.id})">Улучшить</button> <button class="btn btn-sm" onclick="stakeSkin(${s.id})">💰 Стейк</button> ${s.staked?`<button class="btn btn-sm btn-blue" onclick="claimStake(${s.id})">Забрать</button>`:''}`}</div></div>`).join('')); }
            else if(t==='market'){ api('/api/market').then(items=>{ c.innerHTML='<h3>💱 Маркет</h3>'+(items.length===0?'<p style="color:#aaa">Нет предложений</p>':items.map(i=>`<div class="card"><div class="emoji-big">${i.emoji}</div><div class="info"><div class="name">${i.name} <span class="rarity-${i.rarity}">[${i.rarity}]</span></div><div class="detail">Продавец: ${i.seller} | Множитель: x${i.multiplier}</div><div class="gold">💎 ${i.price} TON</div></div><button class="btn btn-sm" onclick="buySkin(${i.id})">Купить</button></div>`).join('')); }); }
            else if(t==='tournament'){ api('/api/tournament').then(tour=>{ c.innerHTML='<h3>🏆 Турнир</h3><div class="card"><div class="info"><div class="name">'+tour.tournament.name+'</div><div class="detail">Призовой фонд: '+tour.tournament.prize+' TON</div><div class="detail">До: '+new Date(tour.tournament.ends).toLocaleString()+'</div></div></div><h4>Лидеры:</h4>'+tour.leaders.map((p,i)=>`<div class="card"><div class="emoji-big">${['🥇','🥈','🥉'][i]||'👤'}</div><div class="info"><div class="name">${p.name}</div><div class="detail">👆 ${p.taps.toLocaleString()} тапов</div></div></div>`).join(''); }); }
            else if(t==='referral'){ c.innerHTML='<h3>👥 Реферальная система</h3><div class="card"><div class="info"><div class="name">Ваша ссылка:</div><div class="detail gold">https://t.me/biz_empire_bot?start='+(userData.referral_code||'')+'</div></div><div class="info" style="margin-top:10px"><div class="name">Пригласи друга → +0.1 TON</div><div class="detail">Друг купит бокс → +10% с покупки</div></div></div>'; }
            else if(t==='top'){ api('/api/top_tappers').then(top=>{ c.innerHTML='<h3>📊 Топ таперов</h3>'+top.map((p,i)=>`<div class="card"><div class="emoji-big">${['🥇','🥈','🥉'][i]||'👤'}</div><div class="info"><div class="name">${p.name||'Игрок'}</div><div class="detail">👆 ${p.taps.toLocaleString()} тапов | ⭐ ${p.level} ур</div></div></div>`).join(''); }); }
        }
        async function tap(){ const d=await api('/api/tap'); if(d.coins_earned){ userData=d.user; document.getElementById('coinBalance').textContent=Math.floor(userData.balance_coins||0).toLocaleString(); document.getElementById('totalTaps').textContent=(userData.total_taps||0).toLocaleString(); document.getElementById('level').textContent=userData.level||1; showFloat('+'+d.coins_earned+'🪙'); } }
        async function openBox(boxId){ const d=await api('/api/open_box?box_id='+boxId); if(d.success){ userData=d.user; document.getElementById('tonBalance').textContent=(userData.balance_ton||0).toFixed(1); showFloat(d.skin.emoji+' '+d.skin.name+'!'); load(); } else alert(d.error); }
        async function connectWallet(){ const address=prompt('Введите адрес вашего TON кошелька:'); if(address){ const d=await api('/api/connect_wallet?address='+address); if(d.success){ document.getElementById('walletBtn').textContent='✅ '+address.substring(0,8)+'...'; alert('Кошелёк привязан!'); } } }
        async function sellSkin(invId){ const price=prompt('Цена в TON:'); if(price&&parseFloat(price)>0){ const d=await api('/api/sell_skin?inv_id='+invId+'&price='+price); if(d.success){ load(); showFloat('📤 Выставлено!'); } } }
        async function buySkin(invId){ const d=await api('/api/buy_skin?inv_id='+invId); if(d.success){ userData=d.user; load(); showFloat('📥 Куплено!'); } else alert(d.error); }
        async function upgradeSkin(invId){ const d=await api('/api/upgrade_skin?inv_id='+invId); if(d.success){ userData=d.user; load(); showFloat('⬆ Улучшено!'); } else alert(d.error); }
        async function stakeSkin(invId){ const days=prompt('На сколько дней (1-30)?','7'); if(days&&parseInt(days)>0){ const d=await api('/api/stake_skin?inv_id='+invId+'&days='+days); if(d.success){ load(); showFloat('🔒 Стейк! +'+d.total+' TON'); } else alert(d.error); } }
        async function claimStake(invId){ const d=await api('/api/claim_stake?inv_id='+invId); if(d.success){ userData=d.user; load(); showFloat('💰 +'+d.reward+' TON!'); } else alert(d.error); }
        function showFloat(text){ const el=document.createElement('div'); el.className='float'; el.textContent=text; el.style.left=Math.random()*70+'%'; el.style.bottom='200px'; document.body.appendChild(el); setTimeout(()=>el.remove(),1200); }
        document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showTab(t.dataset.tab))); load();
    </script>
</body>
</html>
