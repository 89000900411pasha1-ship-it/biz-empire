<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бизнес-Империя</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 100%);
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #2a1a5e, #4a2a8e);
            padding: 12px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; }
        .balance { font-size: 26px; font-weight: bold; color: #ffd700; }
        .income { font-size: 12px; color: #aaa; }
        .tabs {
            display: flex;
            background: #1a1a3e;
            position: sticky;
            top: 90px;
            z-index: 99;
            overflow-x: auto;
        }
        .tab {
            flex: 1;
            min-width: 50px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-size: 11px;
            white-space: nowrap;
        }
        .tab.active { border-bottom-color: #ffd700; color: #ffd700; }
        .content { padding: 12px; padding-bottom: 100px; }
        .card {
            background: linear-gradient(135deg, #1e1e4e, #2a2a5e);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #3a3a6e;
        }
        .row { display: flex; align-items: center; gap: 10px; }
        .emoji { font-size: 36px; min-width: 45px; text-align: center; }
        .info { flex: 1; }
        .name { font-weight: bold; font-size: 14px; }
        .detail { font-size: 11px; color: #aaa; }
        .green { color: #4caf50; }
        .gold { color: #ffd700; }
        .btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-small { padding: 5px 10px; font-size: 11px; }
        .btn-red { background: linear-gradient(135deg, #f44336, #c62828); color: #fff; }
        .btn-green { background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; }
        .btn-blue { background: linear-gradient(135deg, #2196f3, #1565c0); color: #fff; }
        .btn:active { transform: scale(0.95); }
        .collect-btn {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            z-index: 90;
        }
        .float {
            position: fixed;
            font-size: 22px;
            font-weight: bold;
            pointer-events: none;
            animation: up 1.5s ease-out forwards;
            z-index: 200;
        }
        @keyframes up {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-180px); }
        }
        .badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
        }
        .badge-purple { background: #9c27b0; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e1e4e;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 2px solid #4a2a8e;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👑 Бизнес-Империя</h1>
        <div class="balance" id="balance">0 ₽</div>
        <div class="income" id="income">📊 0 ₽/ч | ⚡ <span id="energy">0</span> | ⭐ <span id="level">1</span> ур. | 👑 <span id="prestige">0</span></div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="build">🏗️ Строить</div>
        <div class="tab" data-tab="my">🏢 Мои</div>
        <div class="tab" data-tab="tasks">🎯 Задания</div>
        <div class="tab" data-tab="raid">🥷 Налёт</div>
        <div class="tab" data-tab="shop">💎 Магазин</div>
        <div class="tab" data-tab="top">📊 Топ</div>
    </div>

    <div class="content" id="content"></div>
    <div class="collect-btn" onclick="collectIncome()">💰 СОБРАТЬ ДОХОД</div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalText"></p>
            <button class="btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const API = 'http://localhost:5000';
        let userData = {}, buildings = [], allBuildings = [], tasks = [], tab = 'build';

            function getUserId() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                return tg.initDataUnsafe.user.id;
            }
            return 123; // заглушка для тестов
        }

        async function api(url) {
            const r = await fetch(API + url + (url.includes('?')?'&':'?') + 'user_id=' + getUserId());
            return await r.json();
        }

        async function load() {
            const d = await api('/api/data');
            alert('Buildings: ' + JSON.stringify(d.all_buildings ? d.all_buildings.length : 'UNDEFINED'));
            userData = d.user; buildings = d.buildings; allBuildings = d.all_buildings || [];
            const t = await api('/api/tasks');
            tasks = t || [];
            updateUI();
        }

        function updateUI() {
            document.getElementById('balance').textContent = (userData.balance||0).toLocaleString() + ' ₽';
            document.getElementById('income').innerHTML = `📊 ${(userData.income||0).toLocaleString()} ₽/ч | ⚡ ${userData.energy||0} | ⭐ ${userData.level||1} ур. | 👑 ${userData.prestige||0}`;
            document.getElementById('energy').textContent = userData.energy||0;
            document.getElementById('level').textContent = userData.level||1;
            document.getElementById('prestige').textContent = userData.prestige||0;
            showTab(tab);
        }

        function showTab(t) {
            tab = t;
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelector(`[data-tab="${t}"]`)?.classList.add('active');
            const c = document.getElementById('content');
            
            if (t === 'build') {
                c.innerHTML = '<h3>🏗️ Строительство</h3>' + allBuildings.map(b => {
                    const own = buildings.find(m => m.type === b.type);
                    const lvl = own ? own.level : 0;
                    const cost = Math.floor(b.base_cost * Math.pow(b.cost_mul, lvl));
                    const inc = Math.floor(b.base_income * Math.pow(b.inc_mul, lvl));
                    return `<div class="card row">
                        <div class="emoji">${b.emoji}</div>
                        <div class="info">
                            <div class="name">${b.name} ${own ? '<span class="badge badge-purple">ур.'+lvl+'</span>' : ''}</div>
                            <div class="detail green">📊 ${inc.toLocaleString()} ₽/ч</div>
                            <div class="detail gold">💰 ${cost.toLocaleString()} ₽</div>
                        </div>
                        <button class="btn" onclick="build('${b.type}')">Построить</button>
                    </div>`;
                }).join('');
            } else if (t === 'my') {
                c.innerHTML = '<h3>🏢 Мои здания</h3>' + (buildings.length === 0 ? '<p style="color:#aaa">Нет зданий</p>' : buildings.map(b => `
                    <div class="card row">
                        <div class="emoji">${b.emoji}</div>
                        <div class="info">
                            <div class="name">${b.name} <span class="badge badge-purple">ур.${b.level}</span></div>
                            <div class="detail green">📊 ${Math.floor(b.income).toLocaleString()} ₽/ч</div>
                        </div>
                    </div>
                `).join(''));
            } else if (t === 'tasks') {
                const names = {build:'Построить здания',collect:'Собрать доход',raid:'Совершить налёты'};
                c.innerHTML = '<h3>🎯 Ежедневные задания</h3>' + tasks.map(tsk => `
                    <div class="card">
                        <div class="name">${names[tsk.type] || tsk.type}: ${tsk.progress}/${tsk.target}</div>
                        <div class="detail gold">💰 Награда: ${tsk.reward.toLocaleString()} ₽</div>
                        ${tsk.done ? '<div class="detail green">✅ Выполнено</div>' : (tsk.progress >= tsk.target ? `<button class="btn btn-small btn-green" onclick="claim(${tsk.id})">Забрать</button>` : `<div class="detail" style="color:#aaa">Выполняйте...</div>`)}
                    </div>
                `).join('') + '<br><button class="btn btn-blue" onclick="prestige()">🔄 Престиж (10M ₽)</button>';
            } else if (t === 'raid') {
                c.innerHTML = `<div class="card" style="text-align:center">
                    <p style="font-size:50px">🥷</p>
                    <p>Налёт на случайного игрока!</p>
                    <p style="color:#aaa;font-size:12px">Шанс: 45% | Стоимость: 20⚡</p>
                    <button class="btn btn-red" onclick="raid()">🥷 СОВЕРШИТЬ НАЛЁТ</button>
                </div>`;
            } else if (t === 'shop') {
                c.innerHTML = '<h3>💎 Магазин (скоро)</h3><p style="color:#aaa">Оплата через Telegram Stars</p>';
            } else if (t === 'top') {
                c.innerHTML = '<h3>📊 Загрузка...</h3>';
                api('/api/top').then(top => {
                    c.innerHTML = '<h3>📊 Топ-10</h3>' + top.map((p,i) => `
                        <div class="card row">
                            <div class="emoji">${['🥇','🥈','🥉'][i] || '👤'}</div>
                            <div class="info">
                                <div class="name">${p.name||'Игрок'} ${p.prestige?`👑${p.prestige}`:''}</div>
                                <div class="detail gold">💰 ${p.balance.toLocaleString()} ₽ | ⭐ ${p.level} ур.</div>
                            </div>
                        </div>
                    `).join('');
                });
            }
        }

        async function build(type) {
            const d = await api('/api/build&type='+type);
            if (d.success) { userData = d.user; buildings = d.buildings; showFloat('+🏗️'); updateUI(); }
            else showModal('Ошибка', d.error);
        }

        async function collectIncome() {
            const d = await api('/api/collect');
            if (d.earned > 0) { userData = d.user; buildings = d.buildings; showFloat('+💰 '+Math.floor(d.earned).toLocaleString()); updateUI(); }
            else showFloat('⏳ Пока нечего');
        }

        async function raid() {
            const d = await api('/api/raid');
            if (d.success) { userData = d.user; showFloat('🥷 +'+Math.floor(d.stolen).toLocaleString()); updateUI(); }
            else showModal('Налёт', d.error);
        }

        async function claim(tid) {
            const d = await api('/api/claim_task&task_id='+tid);
            if (d.success) { userData = d.user; showFloat('+🎯 '+d.reward.toLocaleString()); load(); }
        }

        async function prestige() {
            const d = await api('/api/prestige');
            if (d.success) { userData = d.user; buildings = d.buildings; showFloat('🔄 Престиж!'); updateUI(); showModal('Престиж', `Уровень: ${userData.prestige}\nМножитель дохода: x${(1+0.1*userData.prestige).toFixed(1)}`); }
            else showModal('Недостаточно', 'Нужно 10 000 000 ₽');
        }

        function showFloat(text) {
            const el = document.createElement('div');
            el.className = 'float';
            el.textContent = text;
            el.style.left = Math.random()*70+'%';
            el.style.bottom = '120px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        function showModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));
        load();
    </script>
</body>
</html>
